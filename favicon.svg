<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="24" fill="url(#bg-gradient)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Inner Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(0, 245, 160, 0.15)" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Stylized "A" Monogram / Shield -->
  <g filter="url(#glow)">
    <!-- Left Leg -->
    <path d="M 28 72 L 47 25 C 48 22.5 52 22.5 53 25 L 72 72" fill="none" stroke="url(#cyber-gradient)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Modern Slash Crossbar -->
    <path d="M 33 53 L 67 53" fill="none" stroke="url(#cyber-gradient)" stroke-width="5" stroke-linecap="round" />
    <!-- Dynamic Accent Dot -->
    <circle cx="50" cy="38" r="3" fill="#00f5a0" />
  </g>
</svg>
